<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>记忆星图</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 3D Canvas -->
  <div id="canvas-container"></div>

  <!-- Header -->
  <div class="header" id="header">
    <div class="header-title">记忆星图</div>
    <div class="toggle-wrapper" id="toggleWrapper">
      <div class="toggle-option active" data-mode="graph">图谱</div>
      <div class="toggle-option" data-mode="list">列表</div>
      <div class="toggle-slider"></div>
    </div>
  </div>

  <!-- Node Detail Panel -->
  <div class="detail-panel" id="detailPanel">
    <div class="detail-handle"></div>
    <div class="detail-close" id="detailClose">×</div>
    <div class="detail-header">
      <div class="detail-avatar" id="detailAvatar"></div>
      <div class="detail-title-group">
        <div class="detail-name" id="detailName"></div>
        <div class="detail-category" id="detailCategory"></div>
      </div>
    </div>
    <div class="detail-desc" id="detailDesc"></div>
    <div class="detail-fields" id="detailFields"></div>
    <div class="swipe-hint">
      <div class="swipe-arrow">‹</div>
      <div class="swipe-text">左右滑动查看相邻节点</div>
      <div class="swipe-arrow">›</div>
    </div>
  </div>

  <!-- List View -->
  <div class="list-view" id="listView">
    <div class="list-tabs">
      <div class="list-tab active" data-tab="basic">基本信息</div>
      <div class="list-tab" data-tab="preference">用户偏好</div>
      <div class="list-tab" data-tab="events">事件</div>
    </div>
    <div class="list-content" id="listContent"></div>
  </div>

  <!-- Bottom Progress Bar (Graph Mode Only) -->
  <div class="bottom-bar" id="bottomBar">
    <div class="bar-track">
      <div class="bar-fill" id="barFill"></div>
      <div class="bar-dot" id="barDot" style="left: 100%"></div>
    </div>
    <div class="bar-labels">
      <span>二维详情</span>
      <span>三维全局</span>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
